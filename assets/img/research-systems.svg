<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">Representative ROOT Lab research systems</title>
  <desc id="desc">Representative application systems from ROOT Lab papers: terrestrial base-station communication, UAV and maritime autonomous platforms, LEO satellite authentication, awareness-driven covert ISAC, and private wireless distributed learning.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.2; rx: 8; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 15.5px; font-weight: bold; fill: #111111; }
    .small { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; fill: #555555; }
    .node { fill: #f7f7f7; stroke: #1f3a5f; stroke-width: 1.3; }
    .adversary { fill: #fff3f3; stroke: #8b1e1e; stroke-width: 1.3; }
    .trust { fill: #edf7ff; stroke: #1f3a5f; stroke-width: 1.2; }
    .link { stroke: #1f3a5f; stroke-width: 1.35; fill: none; marker-end: url(#arrow); }
    .badlink { stroke: #8b1e1e; stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; marker-end: url(#redarrow); }
    .sense { stroke: #777777; stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f3a5f" /></marker>
    <marker id="redarrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b1e1e" /></marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" class="title">Representative Application Systems</text>

  <rect x="35" y="55" width="405" height="175" class="panel" />
  <text x="237" y="82" text-anchor="middle" class="title">Terrestrial BS / Cellular Communication</text>
  <circle cx="110" cy="165" r="16" class="node"/><text x="110" y="195" text-anchor="middle" class="small">Users</text>
  <circle cx="155" cy="155" r="14" class="node"/><circle cx="190" cy="165" r="13" class="node"/>
  <rect x="278" y="105" width="30" height="75" class="trust"/><line x1="293" y1="105" x2="293" y2="75" stroke="#1f3a5f"/><text x="293" y="198" text-anchor="middle" class="small">BS</text>
  <circle cx="375" cy="138" r="17" class="adversary"/><text x="375" y="170" text-anchor="middle" class="small">Willie/Eve</text>
  <path d="M130 160 C190 118,240 112,278 132" class="link"/>
  <path d="M155 150 C230 175,260 175,278 162" class="link"/>
  <path d="M293 110 C330 93,355 100,370 124" class="badlink"/>
  <text x="236" y="217" text-anchor="middle" class="small">Secure NOMA · artificial noise · multi-user covert links</text>

  <rect x="480" y="55" width="405" height="175" class="panel" />
  <text x="682" y="82" text-anchor="middle" class="title">UAV / USV Autonomous Platforms</text>
  <rect x="540" y="150" width="36" height="20" class="trust"/><text x="558" y="195" text-anchor="middle" class="small">Verifier</text>
  <circle cx="700" cy="118" r="18" class="node"/><line x1="670" y1="118" x2="730" y2="118" stroke="#1f3a5f"/><line x1="700" y1="88" x2="700" y2="148" stroke="#1f3a5f"/><text x="700" y="160" text-anchor="middle" class="small">Legit UAV</text>
  <circle cx="805" cy="145" r="17" class="adversary"/><line x1="780" y1="145" x2="830" y2="145" stroke="#8b1e1e"/><line x1="805" y1="120" x2="805" y2="170" stroke="#8b1e1e"/><text x="805" y="190" text-anchor="middle" class="small">Spoofer</text>
  <path d="M575 150 C620 105,650 100,685 113" class="link"/>
  <path d="M575 155 C650 155,725 150,790 145" class="badlink"/>
  <text x="682" y="217" text-anchor="middle" class="small">Spatial challenge-response · 3D channel maps · single-packet PLA</text>

  <rect x="35" y="255" width="405" height="175" class="panel" />
  <text x="237" y="282" text-anchor="middle" class="title">LEO Satellite / NTN Authentication</text>
  <ellipse cx="235" cy="363" rx="125" ry="35" fill="none" stroke="#d6d6d6" stroke-width="1.1"/>
  <circle cx="235" cy="363" r="32" fill="#f7f7f7" stroke="#d6d6d6"/>
  <circle cx="165" cy="326" r="15" class="node"/><line x1="145" y1="326" x2="185" y2="326" stroke="#1f3a5f"/><text x="165" y="306" text-anchor="middle" class="small">Satellite</text>
  <circle cx="330" cy="318" r="14" class="adversary"/><line x1="310" y1="318" x2="350" y2="318" stroke="#8b1e1e"/><text x="330" y="300" text-anchor="middle" class="small">Spoofer</text>
  <rect x="205" y="388" width="52" height="26" class="trust"/><text x="231" y="399" text-anchor="middle" class="small">Ground</text><text x="231" y="411" text-anchor="middle" class="small">verifier</text>
  <path d="M230 392 C210 370,185 345,165 331" class="link"/>
  <path d="M250 392 C275 365,305 342,330 323" class="badlink"/>
  <text x="237" y="426" text-anchor="middle" class="small">Random temporal checks · Doppler/AoA/RTT consistency</text>

  <rect x="480" y="255" width="405" height="175" class="panel" />
  <text x="682" y="282" text-anchor="middle" class="title">Awareness-Driven Covert ISAC</text>
  <rect x="545" y="358" width="35" height="22" class="trust"/><text x="562" y="407" text-anchor="middle" class="small">BS</text>
  <circle cx="655" cy="310" r="17" class="node"/><line x1="628" y1="310" x2="682" y2="310" stroke="#1f3a5f"/><line x1="655" y1="284" x2="655" y2="336" stroke="#1f3a5f"/><text x="655" y="352" text-anchor="middle" class="small">UAV</text>
  <circle cx="735" cy="375" r="15" class="node"/><text x="735" y="405" text-anchor="middle" class="small">Bob</text>
  <circle cx="815" cy="328" r="17" class="adversary"/><text x="815" y="360" text-anchor="middle" class="small">Willie</text>
  <path d="M580 360 C625 335,650 322,655 315" class="sense"/>
  <path d="M655 315 C705 295,760 300,800 322" class="sense"/>
  <path d="M580 370 C630 388,690 388,723 378" class="link"/>
  <path d="M655 313 C690 328,755 328,800 328" class="badlink"/>
  <text x="682" y="417" text-anchor="middle" class="small">Belief tracking · sensing cover · C-O-R control</text>

  <rect x="257" y="455" width="405" height="160" class="panel" />
  <text x="460" y="482" text-anchor="middle" class="title">Private Wireless Distributed Learning</text>
  <circle cx="340" cy="535" r="13" class="node"/><circle cx="340" cy="580" r="13" class="node"/><circle cx="400" cy="558" r="13" class="node"/>
  <rect x="500" y="532" width="55" height="45" class="trust"/><text x="528" y="596" text-anchor="middle" class="small">Aggregator</text>
  <circle cx="610" cy="555" r="16" class="adversary"/><text x="610" y="590" text-anchor="middle" class="small">Eve</text>
  <path d="M353 535 C410 530,460 532,500 545" class="link"/>
  <path d="M353 580 C415 583,460 570,500 565" class="link"/>
  <path d="M413 558 C450 558,475 558,500 558" class="link"/>
  <path d="M555 553 C575 547,592 547,605 553" class="badlink"/>
  <text x="460" y="625" text-anchor="middle" class="small">OTA-FL · differentially private updates · membership-inference defense</text>
</svg>
