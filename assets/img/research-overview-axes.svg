<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">ROOT Lab research philosophy and four research quadrants</title>
  <desc id="desc">Physical and statistical structure creates security-relevant properties that ROOT Lab uses or controls. The four core research areas are arranged in mathematical quadrants: Covert Communication in Quadrant I, Physical-Layer Authentication in Quadrant II, Physical-Layer Key Generation in Quadrant III, and Physical-Layer-Aided Differential Privacy in Quadrant IV.</desc>
  <style>
    .sans{font-family:Inter,Pretendard,'Noto Sans KR',Arial,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .navy{fill:#0b376c}.ink{fill:#14233a}.muted{fill:#617087}.gold{fill:#d5a529}
    .flow{fill:#f7f9fc;stroke:#dce3eb;stroke-width:1.4}.line{stroke:#bfc9d6;stroke-width:1.5;fill:none}
    .axis{stroke:#223a59;stroke-width:2.1;fill:none}.qfillA{fill:#f6f9fd}.qfillB{fill:#fbfaf5}
    .chip{fill:#eef4fb;stroke:#cfdae8;stroke-width:1}.chipGold{fill:#fff9e8;stroke:#ead69a;stroke-width:1}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#223a59"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>

  <text x="560" y="40" text-anchor="middle" class="sans ink" font-size="15" font-weight="800" letter-spacing="1.8">RESEARCH PHILOSOPHY</text>

  <rect x="55" y="66" width="285" height="94" rx="8" class="flow"/>
  <text x="197" y="100" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Physical / Statistical Structure</text>
  <text x="197" y="130" text-anchor="middle" class="sans muted" font-size="13">Channel · Signal / Noise · Device · Geometry / Mobility</text>

  <path d="M340 113 H408" class="line"/>
  <path d="M397 106 L410 113 L397 120" class="line"/>

  <rect x="410" y="66" width="300" height="94" rx="8" class="flow"/>
  <text x="560" y="100" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Security-Relevant Properties</text>
  <text x="560" y="130" text-anchor="middle" class="sans muted" font-size="13">Distinguishability · Randomness · Asymmetry · Uncertainty</text>

  <path d="M710 113 H778" class="line"/>
  <path d="M767 106 L780 113 L767 120" class="line"/>

  <rect x="780" y="66" width="285" height="94" rx="8" class="flow"/>
  <text x="922" y="100" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Secure System Design</text>
  <text x="922" y="130" text-anchor="middle" class="sans muted" font-size="13">Exploit or control physical structure for security</text>

  <text x="560" y="205" text-anchor="middle" class="sans ink" font-size="15" font-weight="800" letter-spacing="1.8">FOUR CORE RESEARCH QUADRANTS</text>

  <!-- quadrant backgrounds -->
  <rect x="120" y="238" width="440" height="190" class="qfillB"/>
  <rect x="560" y="238" width="440" height="190" class="qfillA"/>
  <rect x="120" y="428" width="440" height="190" class="qfillA"/>
  <rect x="560" y="428" width="440" height="190" class="qfillB"/>

  <!-- Cartesian axes -->
  <line x1="100" y1="428" x2="1020" y2="428" class="axis" marker-end="url(#arrow)"/>
  <line x1="560" y1="642" x2="560" y2="220" class="axis" marker-end="url(#arrow)"/>
  <circle cx="560" cy="428" r="5" fill="#223a59"/>
  <text x="1028" y="421" class="sans muted" font-size="12">x</text>
  <text x="569" y="224" class="sans muted" font-size="12">y</text>
  <text x="572" y="447" class="sans muted" font-size="11.5">origin</text>

  <!-- Quadrant II: PLA -->
  <text x="145" y="263" class="sans gold" font-size="12" font-weight="800" letter-spacing="1">II · AUTHENTICITY</text>
  <text x="145" y="302" class="serif ink" font-size="27" font-weight="700">Physical-Layer Authentication</text>
  <text x="145" y="333" class="sans navy" font-size="15" font-weight="750">Exploit distinguishability</text>
  <text x="145" y="363" class="sans muted" font-size="13.5">Verify whether a signal or transmitter is legitimate.</text>
  <rect x="145" y="382" width="150" height="27" rx="13.5" class="chipGold"/>
  <text x="220" y="400" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Device · Mobility</text>

  <!-- Quadrant I: Covert -->
  <text x="585" y="263" class="sans navy" font-size="12" font-weight="800" letter-spacing="1">I · EXISTENCE</text>
  <text x="585" y="302" class="serif ink" font-size="27" font-weight="700">Covert Communication</text>
  <text x="585" y="333" class="sans navy" font-size="15" font-weight="750">Reduce distinguishability</text>
  <text x="585" y="363" class="sans muted" font-size="13.5">Hide whether communication is taking place.</text>
  <rect x="585" y="382" width="155" height="27" rx="13.5" class="chip"/>
  <text x="662" y="400" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Noise · Interference</text>

  <!-- Quadrant III: PLKG -->
  <text x="145" y="457" class="sans navy" font-size="12" font-weight="800" letter-spacing="1">III · SECRET KEY</text>
  <text x="145" y="496" class="serif ink" font-size="27" font-weight="700">Physical-Layer Key Generation</text>
  <text x="145" y="527" class="sans navy" font-size="15" font-weight="750">Shared randomness &amp; asymmetry</text>
  <text x="145" y="557" class="sans muted" font-size="13.5">Establish a shared secret from physical observations.</text>
  <rect x="145" y="576" width="155" height="27" rx="13.5" class="chip"/>
  <text x="222" y="594" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Reciprocity · Fading</text>

  <!-- Quadrant IV: PHY-aided DP -->
  <text x="585" y="457" class="sans gold" font-size="12" font-weight="800" letter-spacing="1">IV · DATA PRIVACY</text>
  <text x="585" y="496" class="serif ink" font-size="27" font-weight="700">Physical-Layer-Aided DP</text>
  <text x="585" y="527" class="sans navy" font-size="15" font-weight="750">Control distinguishability</text>
  <text x="585" y="557" class="sans muted" font-size="13.5">Limit inference about an individual's data or update.</text>
  <rect x="585" y="576" width="170" height="27" rx="13.5" class="chipGold"/>
  <text x="670" y="594" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Noise · Superposition</text>

  <text x="560" y="678" text-anchor="middle" class="sans muted" font-size="12">Quadrant positions organize the four research areas; the coordinate axes are conceptual rather than quantitative.</text>
  <text x="560" y="700" text-anchor="middle" class="sans muted" font-size="12.5">Security objective × system paradigm × physical-layer method → system-oriented communication security design</text>
</svg>