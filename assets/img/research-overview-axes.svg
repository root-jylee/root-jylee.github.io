<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">ROOT Lab research philosophy and four core research axes</title>
  <desc id="desc">Physical and statistical structure creates distinguishability, randomness, asymmetry and uncertainty. ROOT Lab uses or controls those properties across covert communication, physical-layer authentication, physical-layer key generation and physical-layer-aided differential privacy.</desc>
  <style>
    .sans{font-family:Inter,Pretendard,'Noto Sans KR',Arial,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .navy{fill:#0b376c}.ink{fill:#14233a}.muted{fill:#617087}.gold{fill:#d5a529}
    .card{fill:#fff;stroke:#dce3eb;stroke-width:1.4}.soft{fill:#f7f9fc}.line{stroke:#bfc9d6;stroke-width:1.4}
    .flow{fill:#f7f9fc;stroke:#dce3eb;stroke-width:1.4}.chip{fill:#eef4fb;stroke:#cfdae8;stroke-width:1}
  </style>
  <rect width="1120" height="690" fill="#ffffff"/>

  <text x="560" y="42" text-anchor="middle" class="sans ink" font-size="15" font-weight="800" letter-spacing="1.8">RESEARCH PHILOSOPHY</text>

  <rect x="55" y="70" width="285" height="96" rx="8" class="flow"/>
  <text x="197" y="104" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Physical / Statistical Structure</text>
  <text x="197" y="134" text-anchor="middle" class="sans muted" font-size="13">Channel · Signal / Noise · Device · Geometry / Mobility</text>

  <path d="M340 118 H408" class="line"/>
  <path d="M397 111 L410 118 L397 125" fill="none" class="line"/>

  <rect x="410" y="70" width="300" height="96" rx="8" class="flow"/>
  <text x="560" y="104" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Security-Relevant Properties</text>
  <text x="560" y="134" text-anchor="middle" class="sans muted" font-size="13">Distinguishability · Randomness · Asymmetry · Uncertainty</text>

  <path d="M710 118 H778" class="line"/>
  <path d="M767 111 L780 118 L767 125" fill="none" class="line"/>

  <rect x="780" y="70" width="285" height="96" rx="8" class="flow"/>
  <text x="922" y="104" text-anchor="middle" class="sans navy" font-size="19" font-weight="750">Secure System Design</text>
  <text x="922" y="134" text-anchor="middle" class="sans muted" font-size="13">Exploit or control physical structure for security</text>

  <text x="560" y="218" text-anchor="middle" class="sans ink" font-size="15" font-weight="800" letter-spacing="1.8">FOUR CORE RESEARCH AXES</text>

  <rect x="55" y="250" width="495" height="175" rx="10" class="card"/>
  <rect x="55" y="250" width="8" height="175" rx="4" class="navy"/>
  <text x="88" y="286" class="sans navy" font-size="13" font-weight="800">01 · EXISTENCE</text>
  <text x="88" y="322" class="serif ink" font-size="29" font-weight="700">Covert Communication</text>
  <text x="88" y="353" class="sans ink" font-size="15" font-weight="700">Reduce distinguishability</text>
  <text x="88" y="382" class="sans muted" font-size="13.5">Hide whether communication is taking place.</text>
  <rect x="380" y="278" width="137" height="28" rx="14" class="chip"/>
  <text x="448" y="297" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Noise · Interference</text>

  <rect x="570" y="250" width="495" height="175" rx="10" class="card"/>
  <rect x="570" y="250" width="8" height="175" rx="4" class="gold"/>
  <text x="603" y="286" class="sans navy" font-size="13" font-weight="800">02 · AUTHENTICITY</text>
  <text x="603" y="322" class="serif ink" font-size="29" font-weight="700">Physical-Layer Authentication</text>
  <text x="603" y="353" class="sans ink" font-size="15" font-weight="700">Exploit distinguishability</text>
  <text x="603" y="382" class="sans muted" font-size="13.5">Verify whether a signal or transmitter is legitimate.</text>
  <rect x="895" y="278" width="137" height="28" rx="14" class="chip"/>
  <text x="963" y="297" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Device · Mobility</text>

  <rect x="55" y="445" width="495" height="175" rx="10" class="card"/>
  <rect x="55" y="445" width="8" height="175" rx="4" class="gold"/>
  <text x="88" y="481" class="sans navy" font-size="13" font-weight="800">03 · SECRET KEY</text>
  <text x="88" y="517" class="serif ink" font-size="29" font-weight="700">Physical-Layer Key Generation</text>
  <text x="88" y="548" class="sans ink" font-size="15" font-weight="700">Shared randomness &amp; asymmetry</text>
  <text x="88" y="577" class="sans muted" font-size="13.5">Establish a shared secret from physical observations.</text>
  <rect x="380" y="473" width="137" height="28" rx="14" class="chip"/>
  <text x="448" y="492" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Reciprocity · Fading</text>

  <rect x="570" y="445" width="495" height="175" rx="10" class="card"/>
  <rect x="570" y="445" width="8" height="175" rx="4" class="navy"/>
  <text x="603" y="481" class="sans navy" font-size="13" font-weight="800">04 · DATA PRIVACY</text>
  <text x="603" y="517" class="serif ink" font-size="29" font-weight="700">Physical-Layer-Aided DP</text>
  <text x="603" y="548" class="sans ink" font-size="15" font-weight="700">Control distinguishability</text>
  <text x="603" y="577" class="sans muted" font-size="13.5">Limit inference about an individual's data or update.</text>
  <rect x="895" y="473" width="137" height="28" rx="14" class="chip"/>
  <text x="963" y="492" text-anchor="middle" class="sans navy" font-size="11.5" font-weight="700">Noise · Superposition</text>

  <line x1="55" y1="651" x2="1065" y2="651" stroke="#dce3eb"/>
  <text x="560" y="676" text-anchor="middle" class="sans muted" font-size="12.5">Security objective × system paradigm × physical-layer method → system-oriented communication security design</text>
</svg>