<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Physical-layer authentication</title><desc id="d">A receiver verifies whether a received physical signature is consistent with the legitimate transmitter.</desc><rect width="760" height="300" rx="10" fill="#f8fafc"/><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#c9d3e0" stroke-width="2"><rect x="38" y="55" width="140" height="70" rx="8"/><rect x="38" y="178" width="140" height="70" rx="8"/><rect x="560" y="104" width="160" height="92" rx="8"/></g><text x="108" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#10213b">Legitimate Tx</text><text x="108" y="107" text-anchor="middle" font-size="12" fill="#64748b">expected physics</text><text x="108" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#b8302f">Spoofer</text><text x="108" y="230" text-anchor="middle" font-size="12" fill="#64748b">forged identity</text><path d="M178 90C300 90 360 110 560 140" fill="none" stroke="#3f6fa8" stroke-width="3"/><path d="M178 213C300 213 360 190 560 160" fill="none" stroke="#b8302f" stroke-width="2" stroke-dasharray="6 5"/><g fill="#fff" stroke="#3f6fa8"><circle cx="295" cy="90" r="31"/><circle cx="390" cy="112" r="31"/><circle cx="475" cy="132" r="31"/></g><text x="295" y="86" text-anchor="middle" font-size="11" fill="#10213b">channel</text><text x="295" y="101" text-anchor="middle" font-size="11" fill="#10213b">CSI</text><text x="390" y="108" text-anchor="middle" font-size="11" fill="#10213b">device</text><text x="390" y="123" text-anchor="middle" font-size="11" fill="#10213b">RF</text><text x="475" y="128" text-anchor="middle" font-size="11" fill="#10213b">motion</text><text x="475" y="143" text-anchor="middle" font-size="11" fill="#10213b">geometry</text><text x="640" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#10213b">Verifier</text><text x="640" y="156" text-anchor="middle" font-size="12" fill="#64748b">H₀: authentic</text><text x="640" y="174" text-anchor="middle" font-size="12" fill="#64748b">H₁: spoofed</text><text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#10213b">Verify identity from hard-to-forge physical consistency</text><text x="380" y="282" text-anchor="middle" font-size="12" fill="#64748b">channel reciprocity · device impairments · Doppler / AoA / RTT / trajectory</text></g></svg>