<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Physical-layer-aided differential privacy</title><desc id="d">Multiple users transmit updates over the air; superposition and channel noise help bound the influence of one user's data.</desc><rect width="760" height="300" rx="10" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#10213b">Use wireless mixing and noise as part of the privacy mechanism</text><g fill="#fff" stroke="#c9d3e0" stroke-width="2"><rect x="35" y="58" width="126" height="52" rx="8"/><rect x="35" y="124" width="126" height="52" rx="8"/><rect x="35" y="190" width="126" height="52" rx="8"/><rect x="584" y="105" width="140" height="92" rx="8"/></g><text x="98" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#10213b">User 1</text><text x="98" y="99" text-anchor="middle" font-size="11" fill="#64748b">update x₁</text><text x="98" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#10213b">User 2</text><text x="98" y="165" text-anchor="middle" font-size="11" fill="#64748b">update x₂</text><text x="98" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#10213b">User K</text><text x="98" y="231" text-anchor="middle" font-size="11" fill="#64748b">update xₖ</text><path d="M161 84L310 132M161 150L310 150M161 216L310 168" stroke="#3f6fa8" stroke-width="2.5"/><circle cx="380" cy="150" r="70" fill="#eef4fb" stroke="#3f6fa8" stroke-width="2"/><text x="380" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#10213b">Wireless MAC</text><text x="380" y="148" text-anchor="middle" font-size="12" fill="#64748b">Σ hₖpₖxₖ + n</text><text x="380" y="170" text-anchor="middle" font-size="12" fill="#64748b">OTA superposition</text><text x="380" y="190" text-anchor="middle" font-size="12" fill="#64748b">+ channel noise</text><path d="M450 150H584" stroke="#3f6fa8" stroke-width="3"/><text x="654" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#10213b">Aggregator</text><text x="654" y="154" text-anchor="middle" font-size="12" fill="#64748b">private aggregate</text><text x="654" y="176" text-anchor="middle" font-size="12" fill="#64748b">useful model</text><path d="M275 230H485" stroke="#b8302f" stroke-width="2" stroke-dasharray="5 5"/><text x="380" y="250" text-anchor="middle" font-size="12" fill="#b8302f">neighboring datasets → similar output distributions</text><text x="380" y="282" text-anchor="middle" font-size="12" fill="#64748b">co-design power · beamforming · scheduling · artificial noise for (ε, δ)-DP</text></g></svg>