<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="t d"><title id="t">ROOT Lab research principle</title><desc id="d">Communication systems create physical observations from channels, devices, geometry and noise, which ROOT Lab converts into security objectives.</desc><rect width="1120" height="430" rx="10" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#10213b">Trust begins with what the physical signal reveals</text><text x="560" y="58" text-anchor="middle" font-size="13" fill="#64748b">communication environment → physical observation → security decision / design</text><g fill="#fff" stroke="#c9d3e0" stroke-width="2"><rect x="48" y="110" width="230" height="230" rx="10"/><rect x="445" y="92" width="230" height="266" rx="10"/><rect x="842" y="110" width="230" height="230" rx="10"/></g><text x="163" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#10213b">Communication Systems</text><g font-size="13" fill="#3f6fa8"><text x="163" y="182" text-anchor="middle">Satellite / NTN</text><text x="163" y="218" text-anchor="middle">UAV / Mobile</text><text x="163" y="254" text-anchor="middle">Terrestrial RF</text><text x="163" y="290" text-anchor="middle">Underwater Acoustic</text></g><text x="560" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#10213b">Physical Evidence</text><g fill="#eef4fb" stroke="#9dbbd9"><rect x="478" y="146" width="164" height="38" rx="19"/><rect x="478" y="194" width="164" height="38" rx="19"/><rect x="478" y="242" width="164" height="38" rx="19"/><rect x="478" y="290" width="164" height="38" rx="19"/></g><g text-anchor="middle" font-size="13" fill="#10213b"><text x="560" y="170">Channel</text><text x="560" y="218">Device</text><text x="560" y="266">Geometry / Motion</text><text x="560" y="314">Noise / Interference</text></g><text x="957" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#10213b">Security Objectives</text><g font-size="13" fill="#3f6fa8"><text x="957" y="182" text-anchor="middle">Hide · Existence</text><text x="957" y="218" text-anchor="middle">Verify · Authenticity</text><text x="957" y="254" text-anchor="middle">Establish · Secret Key</text><text x="957" y="290" text-anchor="middle">Protect · Data Privacy</text></g><path d="M278 225H445M675 225H842" stroke="#3f6fa8" stroke-width="3"/><path d="M421 219L445 225L421 231M818 219L842 225L818 231" fill="none" stroke="#3f6fa8" stroke-width="3"/><path d="M560 358V388" stroke="#b8302f" stroke-width="2"/><rect x="376" y="386" width="368" height="30" rx="15" fill="#10213b"/><text x="560" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">System-Oriented Physical-Layer Security Design</text><text x="560" y="84" text-anchor="middle" font-size="12" fill="#b8302f">adversary observes a different physical realization</text></g></svg>