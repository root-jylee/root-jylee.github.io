<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Physical-layer key generation</title><desc id="d">Alice and Bob obtain correlated channel observations and distill a shared key while Eve sees a different observation.</desc><rect width="760" height="300" rx="10" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#10213b">Extract a shared secret from correlated physical observations</text><g fill="#fff" stroke="#c9d3e0" stroke-width="2"><rect x="38" y="92" width="140" height="86" rx="8"/><rect x="582" y="92" width="140" height="86" rx="8"/><rect x="310" y="210" width="140" height="58" rx="8"/></g><text x="108" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#10213b">Alice</text><text x="108" y="143" text-anchor="middle" font-size="12" fill="#64748b">Xⁿ → key K</text><text x="652" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#10213b">Bob</text><text x="652" y="143" text-anchor="middle" font-size="12" fill="#64748b">Yⁿ → key K̂</text><text x="380" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#b8302f">Eve</text><text x="380" y="254" text-anchor="middle" font-size="12" fill="#64748b">different Zⁿ</text><path d="M178 120Q380 48 582 120" fill="none" stroke="#3f6fa8" stroke-width="3"/><path d="M178 150Q380 220 582 150" fill="none" stroke="#9dbbd9" stroke-width="2" stroke-dasharray="6 5"/><path d="M380 78V210" stroke="#b8302f" stroke-width="2" stroke-dasharray="5 5"/><text x="380" y="70" text-anchor="middle" font-size="12" fill="#3f6fa8">reciprocal / correlated channel</text><g transform="translate(250 105)" stroke="#3f6fa8" fill="none"><path d="M0 20q15-35 30 0t30 0t30 0"/><path d="M250 20q15-32 30 1t30-1t30 0"/></g><rect x="244" y="178" width="272" height="28" rx="14" fill="#eef4fb" stroke="#c9d3e0"/><text x="380" y="197" text-anchor="middle" font-size="12" fill="#10213b">quantization → reconciliation → privacy amplification</text><text x="380" y="288" text-anchor="middle" font-size="12" fill="#64748b">goal: K = K̂, while Eve learns negligible information</text></g></svg>