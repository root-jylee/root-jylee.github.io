<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">ROOT Lab research framework</title>
  <desc id="desc">Security and privacy methods are grounded in the physical-layer communication domain and applied to NTN, autonomous platforms, and communication-efficient distributed AI.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.4; rx: 8; }
    .light { fill: #f7f7f7; stroke: #d6d6d6; stroke-width: 1.2; rx: 8; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #111111; }
    .text { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; fill: #111111; }
    .small { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; fill: #555555; }
    .arrow { stroke: #1f3a5f; stroke-width: 1.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f3a5f" />
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" class="title">Method → Domain → Application</text>

  <rect x="35" y="65" width="250" height="230" class="box" />
  <text x="160" y="95" text-anchor="middle" class="title">Security Methods</text>
  <text x="60" y="130" class="text">• Covert communication</text>
  <text x="60" y="160" class="text">• Physical-layer authentication</text>
  <text x="60" y="190" class="text">• Physical-layer secrecy</text>
  <text x="60" y="220" class="text">• Differential privacy</text>
  <text x="60" y="255" class="small">Defense against adversarial inference</text>

  <line x1="300" y1="180" x2="390" y2="180" class="arrow" />

  <rect x="405" y="65" width="230" height="230" class="box" />
  <text x="520" y="95" text-anchor="middle" class="title">Physical-Layer</text>
  <text x="520" y="118" text-anchor="middle" class="title">Communication Domain</text>
  <text x="430" y="155" class="text">• Channels and propagation</text>
  <text x="430" y="185" class="text">• Mobility and interference</text>
  <text x="430" y="215" class="text">• Hardware fingerprints</text>
  <text x="430" y="245" class="small">Physical signals as trust resources</text>

  <line x1="650" y1="180" x2="735" y2="180" class="arrow" />

  <rect x="750" y="65" width="135" height="100" class="light" />
  <text x="817" y="95" text-anchor="middle" class="title">NTN &amp;</text>
  <text x="817" y="118" text-anchor="middle" class="title">Autonomous</text>
  <text x="817" y="141" text-anchor="middle" class="title">Platforms</text>

  <rect x="750" y="195" width="135" height="100" class="light" />
  <text x="817" y="225" text-anchor="middle" class="title">Distributed AI</text>
  <text x="817" y="250" text-anchor="middle" class="small">Private learning</text>
  <text x="817" y="272" text-anchor="middle" class="small">over channels</text>

  <text x="460" y="335" text-anchor="middle" class="small">ROOT Lab builds physical-layer roots of trust for intelligent secure communication systems.</text>
</svg>
