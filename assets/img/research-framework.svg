<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">ROOT Lab research framework</title>
  <desc id="desc">Security and privacy methods are grounded in the physical-layer communication domain and applied to terrestrial cellular networks, NTN and autonomous platforms, and private wireless distributed learning.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.4; rx: 8; }
    .light { fill: #f7f7f7; stroke: #d6d6d6; stroke-width: 1.2; rx: 8; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: bold; fill: #111111; }
    .text { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; fill: #111111; }
    .small { font-family: Georgia, 'Times New Roman', serif; font-size: 12.5px; fill: #555555; }
    .arrow { stroke: #1f3a5f; stroke-width: 1.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f3a5f" />
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" class="title">Method → Physical-Layer Communication Domain → Application</text>

  <rect x="35" y="70" width="250" height="235" class="box" />
  <text x="160" y="100" text-anchor="middle" class="title">Security Methods</text>
  <text x="60" y="135" class="text">• Covert communication</text>
  <text x="60" y="165" class="text">• Physical-layer authentication</text>
  <text x="60" y="195" class="text">• Physical-layer secrecy</text>
  <text x="60" y="225" class="text">• Differential privacy</text>
  <text x="60" y="260" class="small">Defense against adversarial inference</text>

  <line x1="300" y1="188" x2="385" y2="188" class="arrow" />

  <rect x="400" y="70" width="245" height="235" class="box" />
  <text x="522" y="100" text-anchor="middle" class="title">Physical-Layer</text>
  <text x="522" y="122" text-anchor="middle" class="title">Communication</text>
  <text x="522" y="144" text-anchor="middle" class="title">Domain</text>
  <text x="425" y="178" class="text">• Channels and propagation</text>
  <text x="425" y="208" class="text">• Mobility and interference</text>
  <text x="425" y="238" class="text">• Hardware fingerprints</text>
  <text x="425" y="272" class="small">Physical signals as trust resources</text>

  <line x1="660" y1="188" x2="725" y2="188" class="arrow" />

  <rect x="740" y="60" width="150" height="80" class="light" />
  <text x="815" y="90" text-anchor="middle" class="title">Terrestrial BS</text>
  <text x="815" y="113" text-anchor="middle" class="small">cellular / base-station</text>

  <rect x="740" y="155" width="150" height="88" class="light" />
  <text x="815" y="185" text-anchor="middle" class="title">NTN &amp;</text>
  <text x="815" y="208" text-anchor="middle" class="title">Autonomous</text>
  <text x="815" y="229" text-anchor="middle" class="small">UAV · USV · satellite</text>

  <rect x="740" y="260" width="150" height="88" class="light" />
  <text x="815" y="288" text-anchor="middle" class="title">Private Wireless</text>
  <text x="815" y="311" text-anchor="middle" class="title">Distributed</text>
  <text x="815" y="334" text-anchor="middle" class="title">Learning</text>

  <text x="460" y="372" text-anchor="middle" class="small">ROOT Lab builds physical-layer roots of trust for intelligent secure communication systems.</text>
</svg>
