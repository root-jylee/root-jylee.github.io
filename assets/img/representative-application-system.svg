<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Representative application systems</title>
  <desc id="desc">Three-panel research diagram showing covert and ISAC communication, UAV physical-layer authentication, and machine-type random access.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356b9a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3d35"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b63"/>
    </marker>
    <style>
      .panel { fill: #fff; stroke: #c7c7be; stroke-width: 2; }
      .panel-title { font: 700 22px Georgia, "Times New Roman", serif; fill: #222; }
      .label { font: 16px Georgia, "Times New Roman", serif; fill: #222; }
      .small { font: 13px Georgia, "Times New Roman", serif; fill: #555; }
      .node { fill: #f7f7f2; stroke: #555; stroke-width: 2; }
      .blue { fill: #dbeaf5; stroke: #356b9a; }
      .red { fill: #f2dfda; stroke: #9a3d35; }
      .green { fill: #e2eadb; stroke: #5b7d42; }
      .gold { fill: #f2e7c7; stroke: #8a6a23; }
      .link-blue { fill: none; stroke: #356b9a; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .link-red { fill: none; stroke: #9a3d35; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
      .link-gray { fill: none; stroke: #6b6b63; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow-gray); }
      .wave { fill: none; stroke: #356b9a; stroke-width: 2; opacity: .65; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="558" fill="#f7f7f2"/>
  <g transform="translate(24 28)">
    <rect class="panel" x="0" y="0" width="320" height="504" rx="3"/>
    <text class="panel-title" x="20" y="38">Covert &amp; ISAC</text>
    <text class="small" x="20" y="62">Low probability of detection with sensing awareness</text>
    <circle class="node blue" cx="68" cy="198" r="32"/><text class="label" x="46" y="204">Alice</text>
    <circle class="node green" cx="238" cy="160" r="32"/><text class="label" x="220" y="166">Bob</text>
    <circle class="node red" cx="238" cy="286" r="34"/><text class="label" x="214" y="292">Willie</text>
    <path class="link-blue" d="M 99 190 C 138 170, 170 160, 204 160"/>
    <path class="link-red" d="M 95 210 C 142 246, 168 276, 202 284"/>
    <path class="link-gray" d="M 218 255 C 190 226, 164 210, 106 202"/>
    <circle class="node gold" cx="80" cy="378" r="22"/><circle class="node gold" cx="142" cy="410" r="22"/><circle class="node gold" cx="210" cy="386" r="22"/>
    <text class="small" x="44" y="452">Cooperative users / artificial noise</text>
    <path class="link-gray" d="M 101 368 C 130 330, 162 298, 205 286"/><path class="link-gray" d="M 160 396 C 182 360, 204 329, 224 315"/><path class="link-gray" d="M 214 363 C 223 345, 229 328, 233 318"/>
    <path class="wave" d="M 48 108 C 95 75, 178 75, 266 105"/><path class="wave" d="M 58 126 C 109 102, 173 101, 254 127"/>
    <text class="small" x="68" y="108">sensing / awareness</text>
  </g>
  <g transform="translate(380 28)">
    <rect class="panel" x="0" y="0" width="320" height="504" rx="3"/>
    <text class="panel-title" x="20" y="38">PHY Authentication</text>
    <text class="small" x="20" y="62">UAV challenge-response over spatial channels</text>
    <rect class="node green" x="122" y="358" width="78" height="46" rx="4"/><text class="label" x="134" y="386">Verifier</text>
    <path class="node blue" d="M 152 122 L 210 145 L 152 168 L 94 145 z"/><rect class="node blue" x="134" y="100" width="36" height="44" rx="3"/><text class="label" x="136" y="205">UAV</text>
    <path class="link-blue" d="M 158 355 C 145 300, 144 236, 150 174"/><path class="link-red" d="M 178 174 C 208 236, 208 302, 176 356"/>
    <text class="small" x="44" y="260">challenge</text><text class="small" x="210" y="292">response</text>
    <ellipse class="node" cx="162" cy="290" rx="82" ry="26"/><text class="small" x="96" y="295">channel feature space</text>
    <path class="wave" d="M 82 122 C 54 170, 54 224, 84 273"/><path class="wave" d="M 236 122 C 266 170, 266 224, 236 273"/>
    <text class="small" x="42" y="438">Authenticate identities through location- and channel-aware signals.</text>
  </g>
  <g transform="translate(736 28)">
    <rect class="panel" x="0" y="0" width="320" height="504" rx="3"/>
    <text class="panel-title" x="20" y="38">MTC Random Access</text>
    <text class="small" x="20" y="62">Distance-based resource block selection</text>
    <g transform="translate(160 236)"><circle fill="#eeeeea" stroke="#b8b8ae" stroke-width="2" r="122"/><circle fill="none" stroke="#c8c8be" stroke-width="2" r="86"/><circle fill="none" stroke="#d8d8ce" stroke-width="2" r="50"/><rect class="node green" x="-22" y="-72" width="44" height="74" rx="3"/><line x1="0" y1="-72" x2="0" y2="-116" stroke="#555" stroke-width="3"/><path d="M -22 -116 L 0 -150 L 22 -116 z" fill="#f7f7f2" stroke="#555" stroke-width="2"/><text class="small" x="-28" y="24">BS</text></g>
    <rect class="node blue" x="52" y="126" width="52" height="34" rx="3"/><text class="small" x="63" y="148">RB 1</text><rect class="node blue" x="226" y="134" width="52" height="34" rx="3"/><text class="small" x="237" y="156">RB 2</text><rect class="node blue" x="222" y="336" width="54" height="34" rx="3"/><text class="small" x="231" y="358">RB M</text>
    <circle class="node gold" cx="84" cy="324" r="15"/><circle class="node gold" cx="118" cy="386" r="15"/><circle class="node gold" cx="264" cy="274" r="15"/>
    <path class="link-gray" d="M 88 311 C 104 278, 128 250, 150 235"/><path class="link-gray" d="M 132 374 C 148 336, 156 295, 160 250"/><path class="link-gray" d="M 252 265 C 226 248, 198 239, 174 236"/>
    <text class="small" x="46" y="438">Devices choose access blocks according to distance/ring class.</text>
  </g>
</svg>
