<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Covert communication</title><desc id="d">Alice communicates with Bob while Willie tests whether a transmission exists.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f6fa8"/></marker></defs><rect width="760" height="300" rx="10" fill="#f8fafc"/><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#c9d3e0" stroke-width="2"><rect x="42" y="104" width="130" height="78" rx="8"/><rect x="588" y="104" width="130" height="78" rx="8"/><rect x="315" y="210" width="130" height="62" rx="8"/></g><text x="107" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#10213b">Alice</text><text x="107" y="159" text-anchor="middle" font-size="13" fill="#64748b">transmitter</text><text x="653" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#10213b">Bob</text><text x="653" y="159" text-anchor="middle" font-size="13" fill="#64748b">reliable decoding</text><text x="380" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#b8302f">Willie</text><text x="380" y="258" text-anchor="middle" font-size="12" fill="#64748b">H₀ or H₁ ?</text><path d="M172 143H588" stroke="#3f6fa8" stroke-width="3" marker-end="url(#a)"/><path d="M292 143Q380 170 380 210" fill="none" stroke="#b8302f" stroke-width="2" stroke-dasharray="6 5"/><path d="M210 91C250 55 302 55 342 91M418 91C458 55 510 55 550 91" fill="none" stroke="#9dbbd9" stroke-width="2" opacity=".8"/><text x="380" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#10213b">Make transmission statistically indistinguishable from background</text><text x="380" y="120" text-anchor="middle" font-size="12" fill="#3f6fa8">signal + uncertainty / interference</text><text x="380" y="292" text-anchor="middle" font-size="12" fill="#64748b">maximize detection uncertainty while preserving Bob’s reliability</text></g></svg>